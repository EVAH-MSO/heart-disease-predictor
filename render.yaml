services:
  - type: web
    name: heart-disease-predictor
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python download_data.py
      python train_model.py
    startCommand: gunicorn app:app -c gunicorn_config.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
